<title>Quirling Textkorrektur</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: links die echte Website als Vorschau, rechts eine ruhige Korrekturspalte. Hell, eine Akzentfarbe (Quirling-Blau), Status in Form und Farbe. */
@font-face { font-family: 'QPlex'; src: url('site/_astro/{{PLEX}}') format('woff2'); font-weight: 100 700; font-display: swap; }
@font-face { font-family: 'QPlex'; src: url('site/_astro/{{PLEXEXT}}') format('woff2'); font-weight: 100 700; font-display: swap; unicode-range: U+0100-024F, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF; }
:root {
  --bg: #f4f5f9;
  --panel: #ffffff;
  --ink: #22294d;
  --muted: #6b7194;
  --faint: #9aa0bd;
  --line: #e4e6ef;
  --soft: #eef0f8;
  --accent: #313e97;
  --accent-soft: #e8eaf7;
  --ok: #1e8358;
  --ok-soft: #e3f3eb;
  --edit: #313e97;
  --edit-soft: #e8eaf7;
  --unsure: #b06b00;
  --unsure-soft: #fbf0dc;
  --open: #c4c8da;
  --danger: #b4352b;
  --font: 'QPlex', 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 8px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

/* Kopfleiste */
.top { display: flex; align-items: center; gap: 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; }
.brand i { width: 14px; height: 14px; background: var(--accent); transform: rotate(45deg); display: block; border-radius: 2px; }
.brand span { color: var(--muted); font-weight: 400; }
.pagesel { position: relative; min-width: 0; }
.pagesel select { appearance: none; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 7px 32px 7px 12px; font-weight: 500; max-width: 100%; }
.pagesel::after { content: ''; position: absolute; right: 12px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.pager { display: flex; gap: 2px; }
.icon-btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); width: 32px; height: 32px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { color: var(--ink); border-color: var(--faint); }
.icon-btn svg { width: 16px; height: 16px; }
.grow { flex: 1; }
.save { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.save i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.save.live i { background: var(--ok); }
.save.local i { background: var(--unsure); }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.who img { width: 24px; height: 24px; border-radius: 50%; }
.who b { color: var(--ink); font-weight: 500; }
.mtabs { display: none; }

/* Hauptbereich */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 440px; min-height: 0; }
.pv { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
.pv-bar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; flex-wrap: wrap; }
.pv-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pv-title small { color: var(--faint); font-weight: 400; margin-left: 6px; }
.seg { display: inline-flex; background: var(--soft); border-radius: var(--r); padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 6px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(34 41 77 / 0.12); }
.pv-stage { position: relative; min-height: 0; overflow: hidden; display: flex; justify-content: center; padding: 0 16px 16px; }
.pv-frame { position: relative; background: #fff; box-shadow: 0 1px 3px rgb(34 41 77 / 0.08), 0 8px 30px rgb(34 41 77 / 0.08); border-radius: 6px; overflow: hidden; }
.pv-frame iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #fff; }
.pv-load { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); background: var(--bg); font-size: 13px; }
.pv-hint { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: var(--r); font-size: 13px; box-shadow: 0 6px 20px rgb(34 41 77 / 0.2); max-width: calc(100% - 32px); }

/* Spalte */
.side { background: var(--panel); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0; min-width: 0; }
.tabs { display: flex; gap: 4px; padding: 10px 16px 0; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 8px 10px 10px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .count { color: var(--faint); font-weight: 400; margin-left: 4px; }
.sub { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--soft); }
.bar span { display: block; height: 100%; }
.bar .b-ok { background: var(--ok); }
.bar .b-edit { background: var(--edit); }
.bar .b-unsure { background: var(--unsure); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }
.chip i, .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.d-ok { background: var(--ok); } .d-edit { background: var(--edit); } .d-unsure { background: var(--unsure); } .d-offen { background: var(--open); }
.sub-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-size: 13px; text-decoration: underline; text-underline-offset: 2px; }
.link:disabled { color: var(--faint); text-decoration: none; cursor: default; }
.scroll { overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
.list { padding: 6px 0 24px; }
.grp { padding: 16px 16px 6px; font-size: 12px; color: var(--faint); letter-spacing: 0.02em; position: sticky; top: 0; background: var(--panel); z-index: 1; }

.card { margin: 0 10px; padding: 10px 10px 10px 14px; border-radius: var(--r); position: relative; display: grid; gap: 8px; scroll-margin: 40px; }
.card::before { content: ''; position: absolute; left: 4px; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; background: var(--open); }
.card.st-ok::before { background: var(--ok); }
.card.st-edit::before { background: var(--edit); }
.card.st-unsure::before { background: var(--unsure); }
.card:hover, .card.hov { background: var(--soft); }
.card.sel { background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); }
.c-text { white-space: pre-line; overflow-wrap: anywhere; cursor: pointer; }
.c-text.big { font-weight: 600; }
.c-text .tag { font-size: 11px; color: var(--faint); margin-right: 6px; letter-spacing: 0.03em; }
.c-img { display: flex; gap: 10px; align-items: center; cursor: pointer; }
.c-img img { width: 64px; height: 44px; object-fit: cover; border-radius: 4px; background: var(--soft); flex: none; }
.c-img span { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.c-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.c-meta { font-size: 12px; color: var(--faint); }
.acts { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); overflow: hidden; }
.acts button { border: 0; background: none; padding: 4px 9px; font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.acts button + button { border-left: 1px solid var(--line); }
.acts button:hover { color: var(--ink); background: var(--soft); }
.acts svg { width: 13px; height: 13px; }
.acts button[aria-pressed="true"][data-a="ok"] { background: var(--ok-soft); color: var(--ok); }
.acts button[aria-pressed="true"][data-a="edit"] { background: var(--edit-soft); color: var(--edit); }
.acts button[aria-pressed="true"][data-a="unsure"] { background: var(--unsure-soft); color: var(--unsure); }
.c-orig { font-size: 13px; color: var(--muted); white-space: pre-line; overflow-wrap: anywhere; }
.c-orig del { text-decoration-color: rgb(180 53 43 / 0.6); }
.c-note { font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; white-space: pre-line; overflow-wrap: anywhere; }
.c-note b { font-weight: 500; color: var(--muted); }
.c-hist { font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
.c-warn { font-size: 12.5px; color: var(--unsure); }
.ed { display: grid; gap: 8px; }
.ed textarea, .field { width: 100%; border: 1px solid var(--faint); border-radius: 6px; padding: 8px 10px; background: var(--panel); resize: vertical; line-height: 1.45; }
.ed textarea:focus, .field:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.ed .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 6px 12px; font-weight: 500; font-size: 13px; }
.btn:hover { border-color: var(--faint); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.pri:hover { background: #283380; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn:disabled { opacity: 0.5; cursor: default; }
.empty { padding: 32px 20px; color: var(--muted); text-align: center; font-size: 13px; }

/* Fußbereich der Spalte: Freigabe zur Umsetzung */
.foot { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 8px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
.rel { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
.rel .state { color: var(--muted); }
.rel .state.done { color: var(--ok); font-weight: 500; }
.rel .state.warn { color: var(--unsure); }

/* Anregungen */
.notes { padding: 14px 16px 24px; display: grid; gap: 14px; }
.n-form { display: grid; gap: 8px; }
.n-item { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; }
.n-item.done .n-text { color: var(--faint); text-decoration: line-through; }
.n-text { white-space: pre-line; overflow-wrap: anywhere; }
.n-meta { font-size: 12px; color: var(--faint); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* Übersicht */
.ov { padding: 8px 0 24px; }
.ov-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: center; }
.ov-row:hover { background: var(--soft); }
.ov-row.cur { background: var(--soft); }
.ov-name { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-num { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ov-row .bar { grid-column: 1 / -1; }
.ov-st { grid-column: 1 / -1; display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ov-st .rel-ok { color: var(--ok); font-weight: 500; }
.ov-tot { padding: 16px; display: grid; gap: 10px; }
.ov-tot h3 { margin: 0; font-size: 15px; font-weight: 600; }
.ov-tools { padding: 16px; display: grid; gap: 10px; border-top: 1px solid var(--line); margin-top: 8px; font-size: 13px; color: var(--muted); }
.ov-tools .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Hinweisleiste (lokaler Modus) */
.banner { background: var(--unsure-soft); color: #6d4300; padding: 10px 16px; font-size: 13px; display: grid; gap: 8px; border-bottom: 1px solid #f0dfbd; }
.banner .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.banner input { border: 1px solid #e2c793; border-radius: 6px; padding: 5px 8px; background: #fff; min-width: 0; flex: 1 1 140px; }

/* Dialog */
.modal { position: fixed; inset: 0; background: rgb(34 41 77 / 0.35); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal > div { background: var(--panel); border-radius: 12px; padding: 20px; width: min(560px, 100%); display: grid; gap: 12px; box-shadow: 0 20px 60px rgb(34 41 77 / 0.25); max-height: calc(100% - 32px); overflow: auto; }
.modal h3 { margin: 0; font-size: 16px; }
.modal p { margin: 0; color: var(--muted); }
.modal textarea { width: 100%; min-height: 160px; font-family: ui-monospace, monospace; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.modal .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: var(--r); font-size: 13px; z-index: 30; box-shadow: 0 6px 20px rgb(34 41 77 / 0.25); }

@media (max-width: 1100px) { .main { grid-template-columns: minmax(0, 1fr) 380px; } .who b { display: none; } }
@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .app[data-mview="korr"] .pv, .app[data-mview="vorschau"] .side { display: none; }
  .side { border-left: 0; }
  .mtabs { display: inline-flex; }
  .brand span, .save span, .who, .top .grow { display: none; }
  .top { flex-wrap: wrap; row-gap: 8px; }
  .mtabs { margin-left: auto; }
  .pagesel { order: 3; flex: 1 1 200px; }
  .pagesel select { width: 100%; }
  .pager { order: 4; }
  .pv-bar { padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  .pv-stage { padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app" id="app" data-mview="vorschau">
  <header class="top">
    <div class="brand"><i></i>Quirling <span>Textkorrektur</span></div>
    <div class="pagesel"><select id="pageSel" aria-label="Seite"></select></div>
    <div class="pager">
      <button class="icon-btn" id="prevPg" aria-label="Vorherige Seite" title="Vorherige Seite"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3 5 8l5 5"/></svg></button>
      <button class="icon-btn" id="nextPg" aria-label="Nächste Seite" title="Nächste Seite"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 3 5 5-5 5"/></svg></button>
    </div>
    <div class="seg mtabs" id="mtabs" role="group" aria-label="Ansicht">
      <button data-v="vorschau" aria-pressed="true">Vorschau</button>
      <button data-v="korr" aria-pressed="false">Korrektur</button>
    </div>
    <div class="grow"></div>
    <div class="save" id="saveState"><i></i><span>Verbinde …</span></div>
    <div class="who" id="who"></div>
  </header>

  <div class="main">
    <section class="pv" aria-label="Vorschau der Website">
      <div class="pv-bar">
        <div class="pv-title grow" id="pvTitle"></div>
        <div class="seg" role="group" aria-label="Textstand">
          <button data-ver="orig" aria-pressed="false">Original</button>
          <button data-ver="korr" aria-pressed="true">Korrigiert</button>
        </div>
        <div class="seg" role="group" aria-label="Gerät">
          <button data-dev="desktop" aria-pressed="true">Desktop</button>
          <button data-dev="mobil" aria-pressed="false">Handy</button>
        </div>
        <div class="seg" role="group" aria-label="Klicken in der Vorschau">
          <button data-pick="1" aria-pressed="true" title="Klick auf einen Text wählt ihn zur Korrektur aus">Auswählen</button>
          <button data-pick="0" aria-pressed="false" title="Website normal bedienen: Menü, Filter, Projektfenster">Bedienen</button>
        </div>
      </div>
      <div class="pv-stage" id="stage">
        <div class="pv-frame" id="frameBox">
          <iframe id="frame" title="Vorschau der Website"></iframe>
          <div class="pv-load" id="pvLoad">Seite wird geladen …</div>
        </div>
        <div class="pv-hint" id="pvHint" hidden></div>
      </div>
    </section>

    <aside class="side" aria-label="Korrektur">
      <div>
        <div id="banner"></div>
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="texte" aria-selected="true">Texte<span class="count" id="cntTexte"></span></button>
          <button role="tab" data-tab="anregungen" aria-selected="false">Anregungen<span class="count" id="cntNotes"></span></button>
          <button role="tab" data-tab="uebersicht" aria-selected="false">Übersicht</button>
        </div>
      </div>
      <div class="sub" id="sub"></div>
      <div class="scroll" id="scroll"></div>
      <div class="foot" id="foot"></div>
    </aside>
  </div>
</div>
<div id="layer"></div>

<script>
/*QCORE*/
</script>
<script>
(function () {
  'use strict';
  var Q = QCORE;
  var SITE = new URL('site/', document.baseURI).href;
  var GLOBAL = 'global';
  var LBL = { ok: 'Freigegeben', edit: 'Geändert', unsure: 'Unsicher', offen: 'Offen' };
  var ICON = {
    ok: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 8.5 3.2 3L13 4.5"/></svg>',
    edit: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10.5 2.8 13.2 5.5 6 12.7l-3.3.6.6-3.3z"/></svg>',
    unsure: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5.8 6a2.3 2.3 0 1 1 3.3 2.1c-.7.4-1.1.9-1.1 1.7v.4"/><circle cx="8" cy="12.6" r=".5" fill="currentColor"/></svg>'
  };

  // ---------- Zustand ----------
  var S = {
    data: null, lists: [], items: {}, listOf: {},
    recs: {}, notes: [], rel: {}, hist: {},
    me: { id: null, name: '', avatarUrl: '' }, owner: false, names: {},
    mode: 'laden', store: null,
    list: 'start', page: 'start', tab: 'texte', filter: 'alle',
    dev: 'desktop', ver: 'korr', pick: true, sel: null, editing: null, draft: null, hover: null
  };
  var pref = load('qk-pref') || {};
  if (pref.dev) S.dev = pref.dev;
  else if (window.innerWidth <= 860) S.dev = 'mobil';
  if (pref.filter) S.filter = pref.filter;

  function load(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function keep(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function savePref() { keep('qk-pref', { dev: S.dev, filter: S.filter }); }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function when(ms) {
    if (!ms) return '';
    var d = new Date(ms), now = new Date();
    var t = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return 'heute ' + t;
    return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' ' + t;
  }
  function nameOf(r) {
    if (!r) return '';
    if (r.vonName) return r.vonName;
    if (r.von && r.von === S.me.id) return 'Sie';
    return (r.von && S.names[r.von]) || 'Jemand';
  }
  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }

  // ---------- Daten ----------
  function statusOf(k) { var r = S.recs[k]; return r ? r.status : 'offen'; }
  function curText(k) { var r = S.recs[k], it = S.items[k]; return r && r.status === 'edit' && r.text != null && it.typ !== 'bild' && it.typ !== 'video' ? r.text : it.text; }
  function listItems(id) { var l = S.lists.find(function (x) { return x.id === id; }); return l ? l.items : []; }
  function counts(id) {
    var c = { ok: 0, edit: 0, unsure: 0, offen: 0, n: 0 };
    listItems(id).forEach(function (it) { c[statusOf(it.k)]++; c.n++; });
    return c;
  }
  function barHtml(c) {
    if (!c.n) return '<div class="bar"></div>';
    function w(x) { return (100 * x / c.n).toFixed(2) + '%'; }

        var done = function () { toast('Kopiert'); };
        try { navigator.clipboard.writeText(ta.value).then(done, function () { ta.select(); toast('Bitte mit Strg+C kopieren'); }); } catch (err) { ta.select(); }
      } else { onOk(ta.value); m.remove(); }
    });
  }

  // ---------- Start ----------
  fetch('texte.json').then(function (r) { return r.json(); }).then(function (d) {
    S.data = d;
    S.lists = d.seiten.map(function (p) { return { id: p.id, titel: p.titel, items: p.eintraege }; });
    S.lists.push({ id: GLOBAL, titel: 'Kopf- und Fußzeile', items: d.global });
    S.lists.forEach(function (l) { l.items.forEach(function (it) { S.items[it.k] = it; S.listOf[it.k] = l.id; }); });
    var h = location.hash.slice(1), last = load('qk-list');
    S.list = S.lists.some(function (l) { return l.id === h; }) ? h : S.lists.some(function (l) { return l.id === last; }) ? last : 'start';
    S.page = S.list === GLOBAL ? 'start' : S.list;
    syncSegs(); fit();
    dataReady = true;
    renderAll();
    loadPage(S.page);
    connect();
  }).catch(function () { $('scroll').innerHTML = '<div class="empty">Die Texte konnten nicht geladen werden. Bitte die Seite neu laden.</div>'; });

  function connect() {
    var c = window.claude;
    if (!c || !c.use) { goLocal(); return; }
    Promise.all([c.use('db'), c.use('user'), c.use('downloads')]).then(function (r) {
      var db = r[0], user = r[1];
      dl = r[2];
      userApi = user;
      var who = user ? user.me() : Promise.resolve(null);
      var canW = user ? user.can('data.write') : Promise.resolve(null);
      Promise.all([who, canW]).then(function (x) {
        var me = x[0];
        if (me) { S.me = me; S.owner = !!me.isOwner; }
        if (me && me.id) $('who').innerHTML = '<img alt="" src="' + esc(me.avatarUrl) + '"><b></b>', $('who').querySelector('b').textContent = me.name || 'Sie';
        if (db && x[1] !== false && me && me.id) { S.store = dbStore(db); S.store.watch(); }
        else goLocal();
        renderAll();
      });
    });
  }
  new ResizeObserver(fit).observe($('stage'));
})();
</script>
